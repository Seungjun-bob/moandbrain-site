<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>관리 기록 · 모앤브레인</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>/* 고객이 받아 여는 관리 기록 페이지 — 홈페이지 B안(흰 바탕 · 검정 · 민트는 한 곳) · 마루 부리 제목 · 직각 · 선
   평가 DS 4-1 · UI 5-A · UX 6절 (docs/평가_v3/) */
@font-face{font-family:'MaruBuri';src:url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Regular.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'MaruBuri';src:url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-SemiBold.woff2) format('woff2');font-weight:600;font-display:swap}
:root{--ink:#000;--ink-2:#4d4d4d;--ink-3:#767676;--line:rgba(0,0,0,.14);--soft:#EEF7F3;--serif:"MaruBuri","Noto Serif KR",serif;--sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font:400 16px/28px var(--sans);word-break:keep-all;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:0 20px 120px}
a{color:inherit}
.hd{display:flex;justify-content:center;padding:22px 0 18px;border-bottom:1px solid var(--line)}
.hd svg{height:16px;width:auto;display:block}
h1{font:600 26px/36px var(--serif);margin:36px 0 6px;letter-spacing:0}
.sub{font-size:14px;line-height:22px;color:var(--ink-2);margin:0}
h2{font:600 19px/28px var(--serif);margin:0 0 14px;letter-spacing:0}
section{margin-top:44px}
.now{background:var(--soft);padding:22px 20px 20px;margin-top:28px}
.now h2{margin-bottom:10px}
dl{margin:0}
.now dl div{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.08);font-size:15px;line-height:24px}
.now dl div:last-child{border-bottom:0}
dt{color:var(--ink-2)}
dd{margin:0}
.say{margin:14px 0 0;font-size:16px;line-height:28px}
.say b{display:block;font-size:13px;line-height:20px;color:var(--ink-2);font-weight:400;margin-bottom:4px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
figure{margin:0}
.pair img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;background:#f2f2f2}
figcaption{font-size:14px;line-height:22px;margin-top:6px}
.note{font-size:13px;line-height:20px;color:var(--ink-2);margin:6px 0 0}
table{width:100%;border-collapse:collapse;font-size:15px;line-height:24px}
th{font-weight:400;color:var(--ink-2);font-size:13px;text-align:left;padding:0 10px 8px 0;border-bottom:1px solid #000}
td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
th:last-child,td:last-child{padding-right:0}
.r{text-align:right}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.hc{margin:0;padding:0;list-style:none;border-top:1px solid #000}
.hc li{padding:12px 0;border-bottom:1px solid var(--line)}
.next p{margin:0 0 16px}
.btn{display:flex;align-items:center;justify-content:center;height:56px;background:#000;color:#fff;text-decoration:none;font-weight:500;font-size:16px;width:100%}
.btn:hover{background:#333}
.tel{display:inline-block;margin-top:14px;font-size:15px;text-decoration:underline;text-underline-offset:4px;min-height:44px;line-height:44px}
.hist td small{display:block;color:var(--ink-2);font-size:13px;line-height:20px}
details{margin-top:10px}
summary{cursor:pointer;font-size:15px;min-height:44px;line-height:44px;text-decoration:underline;text-underline-offset:4px}
.ft{margin-top:56px;padding-top:20px;border-top:1px solid #000;font-size:13px;line-height:21px;color:var(--ink-2)}
.ft p{margin:0 0 10px}
.ft b{color:#000;font-weight:500}
.demo{display:inline-block;font-size:12px;color:var(--ink-3);margin-left:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 20px calc(10px + env(safe-area-inset-bottom));display:none}
.bar .btn{max-width:520px;margin:0 auto}
.msg{margin-top:48px}
.msg p{margin:0 0 14px}
:focus-visible{outline:2px solid #000;outline-offset:2px}
@media (max-width:600px){.bar{display:block}.next .btn{display:none}}
@media (min-width:601px){main{padding-bottom:64px}}
@media print{.bar,.next .btn,.tel{display:none!important}main{padding:0}section{break-inside:avoid}.now{background:none;border:1px solid var(--line)}}
/* 움직임 — 홈페이지 규칙: 첫 화면만 한 번 16px 올라오며 나타남 · 사진은 불러온 뒤 옅게 · 접이식은 누를 때만 · 동작 줄이기면 끔 */
:root{--ease:cubic-bezier(.2,0,0,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes fadein{from{opacity:0}}
@media (prefers-reduced-motion:no-preference){
  .enter h1,.enter .sub{animation:rise .3s var(--ease) both}
  .enter .now{animation:rise .3s var(--ease) .06s both}
  .pair img{opacity:0;transition:opacity .3s var(--ease)}
  .pair img.is-loaded{opacity:1}
  details[open]>table{animation:rise .25s var(--ease) both}
  .btn{transition:background-color .2s var(--ease)}
  .msg h1,.msg p{animation:rise .3s var(--ease) both}
}
</style>
</head>

<main id="app"></main>
<script>/* ── 고객 페이지 링크: 기록을 JSON → deflate-raw → base64url 로 바꿔 주소의 # 뒤에 담는다.
   # 뒤는 브라우저 안에서만 읽고 서버로 보내지 않는다 (RFC 3986 3.5). CRM과 고객 페이지가 같은 파일을 쓴다 ── */
const b64u = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64u = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); const b = atob(s + '==='.slice((s.length + 3) % 4)); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function zpipe(u8, T) { const r = new Blob([u8]).stream().pipeThrough(new T('deflate-raw')); return new Uint8Array(await new Response(r).arrayBuffer()); }
async function packRec(o) {
  const raw = new TextEncoder().encode(JSON.stringify(o));
  if (typeof CompressionStream === 'undefined') return '0' + b64u(raw);
  return '1' + b64u(await zpipe(raw, CompressionStream));
}
async function unpackRec(s) {
  const z = s[0] === '1', u8 = unb64u(s.slice(1));
  return JSON.parse(new TextDecoder().decode(z ? await zpipe(u8, DecompressionStream) : u8));
}

;

function photos(r) {

    return `<div class="pair">${['b', 'a'].map(k => src(k) ? `<figure><img src="img/${esc(src(k))}.jpg" alt="${PART[pt] || ''} 현미경 사진, 케어 ${k === 'b' ? '전' : '후'}" width="436" height="327" loading="lazy"><figcaption>${PART[pt] || ''} · 케어 ${k === 'b' ? '전' : '후'}</figcaption></figure>` : '<figure></figure>').join('')}</div>`;
