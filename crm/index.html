/*$vite$:1*/
/* ── 모앤브레인 CRM 데모 — e-HR 디자인 시스템 위에 얹는 추가 스타일 ── */

/* 예약 채널 색 */
:root{--ch-naver:#e7f6ed;--ch-naver-ink:#0b7a3e;--ch-daangn:#fff0e5;--ch-daangn-ink:#b8520b;--ch-mrt:#e8f0fb;--ch-mrt-ink:#0a58ca;--ch-phone:#f0f0f2;--ch-phone-ink:#4a4a4f;--ch-biz:#f2ecfa;--ch-biz-ink:#6b3fa0}
.ch-naver{background:var(--ch-naver);color:var(--ch-naver-ink)}
.ch-daangn{background:var(--ch-daangn);color:var(--ch-daangn-ink)}
.ch-mrt{background:var(--ch-mrt);color:var(--ch-mrt-ink)}
.ch-phone{background:var(--ch-phone);color:var(--ch-phone-ink)}
.ch-biz{background:var(--ch-biz);color:var(--ch-biz-ink)}
.cal-item.is-pending{background:repeating-linear-gradient(135deg,#fff 0 6px,var(--pearl) 6px 12px);color:var(--ink-80);box-shadow:inset 0 0 0 1px var(--hairline)}
.cal-item.is-conflict{box-shadow:inset 0 0 0 1.5px var(--bad)}
.cal-item.is-done{opacity:.55}
.ch-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.ch-dot.ch-naver{background:var(--ch-naver-ink)}.ch-dot.ch-daangn{background:var(--ch-daangn-ink)}.ch-dot.ch-mrt{background:var(--ch-mrt-ink)}.ch-dot.ch-phone{background:var(--ch-phone-ink)}.ch-dot.ch-biz{background:var(--ch-biz-ink)}
.legend{display:inline-flex;flex-wrap:wrap;gap:6px 14px;font-size:var(--fs-caption);color:var(--ink-80)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* 하루 스케줄 — 시간 × 동시 관리 칸 */
.sched{display:flex;flex-direction:column}
.sched-row{display:grid;grid-template-columns:56px repeat(var(--lanes,2),minmax(0,1fr));gap:8px;padding:5px 0;border-bottom:1px solid var(--divider-soft);align-items:stretch}
.sched-row:last-child{border-bottom:0}
.sched-time{font-size:var(--fs-caption);color:var(--ink-48);font-variant-numeric:tabular-nums;padding-top:9px}
.sched-cell{border-radius:var(--r-sm);padding:7px 10px;font-size:13px;line-height:1.35;min-height:40px;min-width:0;overflow:hidden;text-align:left}
.sched-cell .t{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sched-cell .s{font-size:12px;opacity:.85;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sched-free{box-shadow:inset 0 0 0 1px var(--hairline);color:var(--ink-24);display:flex;align-items:center}
.sched-head{display:grid;grid-template-columns:56px repeat(var(--lanes,2),minmax(0,1fr));gap:8px;font-size:var(--fs-caption);color:var(--ink-48);font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--hairline)}

.sched2{display:grid;grid-template-columns:56px repeat(var(--lanes,2),minmax(0,1fr));grid-auto-rows:30px;gap:3px 8px;padding-top:6px}
.sched2 .sched-cell{min-height:0;height:100%;padding:5px 10px}
.sched2 .sched-free{border-radius:6px;box-shadow:inset 0 0 0 1px var(--divider-soft);background:transparent}
.sched2 button.sched-free{cursor:pointer}
.sched2 button.sched-free:hover{background:var(--blue-tint);box-shadow:inset 0 0 0 1px var(--blue-focus)}
.sched2 .sched-time{padding-top:0;line-height:30px}

/* 자동 안내 흐름 */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.flow-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.flow-col>h3{font-size:var(--fs-ui);color:var(--ink-48);font-weight:600;display:flex;align-items:center;gap:8px}
.flow-col>h3 .n{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.flow-step{border:1px solid var(--hairline);border-radius:var(--r-md);padding:12px 14px;background:var(--canvas);display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;transition:background-color var(--dur-1) var(--ease)}
button.flow-step:hover{background:var(--hover-1)}
.flow-step .k{font-size:12px;color:var(--ink-48);font-variant-numeric:tabular-nums}
.flow-step .t{font-size:var(--fs-ui);font-weight:600}
.flow-step .row{flex-wrap:wrap;gap:6px}
.flow-step.is-off{background:var(--pearl);border-style:dashed}

/* 포털 미리보기 — 휴대폰 틀 */
.phone{width:100%;max-width:390px;border-radius:36px;padding:12px;background:var(--tile);box-shadow:0 20px 50px #0000002e}
.phone-screen{background:var(--canvas);border-radius:26px;overflow:hidden;max-height:760px;overflow-y:auto}
.portal-hero{background:var(--parchment);padding:28px 22px 20px}
.portal-hero .brand{font-size:12px;letter-spacing:.12em;color:var(--ink-48);font-weight:600}
.portal-sec{padding:18px 22px;border-top:1px solid var(--divider-soft)}
.portal-sec h3{font-size:var(--fs-ui);margin-bottom:10px}
.portal-note{font-size:11.5px;color:var(--ink-48);line-height:1.5;background:var(--pearl);border-radius:var(--r-sm);padding:10px 12px}

/* 사진 · 측정 결과 자리 */
.slot-img{aspect-ratio:4/3;border:1px dashed var(--ink-24);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink-48);font-size:12px;background:var(--pearl);padding:8px}
.slot-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.slot-val{border:1px dashed var(--ink-24);border-radius:var(--r-sm);padding:10px 12px;font-size:12px;color:var(--ink-48);background:var(--pearl)}

/* 기타 */
.demo-flag{font-size:11px;color:var(--ink-48);line-height:1.45;padding:0 12px 10px}
.shell.is-admin .demo-flag{color:#ffffff80}
.note-q{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--bad);background:var(--bad-bg);border-radius:var(--r-pill);padding:1px 8px;white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:var(--fs-ui);padding:8px 0;border-bottom:1px solid var(--divider-soft)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--ink-48)}
.msg-bubble{background:var(--parchment);border-radius:14px 14px 14px 4px;padding:12px 14px;font-size:13.5px;line-height:1.55;white-space:pre-line}
.page-intro{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.page-intro p{color:var(--ink-48);font-size:var(--fs-ui)}
.gate{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
.gate .arr{color:var(--ink-24)}
.gate .on{font-weight:700;color:var(--ink)}
.gate .off{color:var(--ink-48)}
.mnav{display:none}
.is-meeting .no-meet{display:none!important}
.grid-3>.wide{grid-column:span 2}
.slot-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
.slot-pick .chip{justify-content:center;padding:0;font-variant-numeric:tabular-nums}
.slot-pick .chip:disabled{opacity:.3;cursor:not-allowed;text-decoration:line-through}
.check-row{display:flex;align-items:center;gap:8px;font-size:var(--fs-ui);padding:4px 0;cursor:pointer}
.check-row input{width:16px;height:16px;accent-color:var(--blue)}
.textarea{width:100%}
.deadline-over{color:var(--bad);font-weight:600}
.grid-2>*,.grid-3>*{min-width:0}

@media (max-width:1100px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .shell{flex-direction:column}
  .sidebar{display:none}
  .mnav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--hairline);background:var(--parchment);position:sticky;top:0;z-index:20}
  .mnav a{flex:none;font-size:13px;padding:6px 12px;border-radius:var(--r-pill);color:var(--ink);background:var(--canvas);box-shadow:inset 0 0 0 1px var(--hairline)}
  .mnav a.active{color:var(--blue);font-weight:600;box-shadow:inset 0 0 0 2px var(--blue-focus)}
  .shell-content{padding:16px 16px 48px}
  .flow{grid-template-columns:1fr}
  .cal-cell{min-height:64px;padding:4px}
  .cal-item{font-size:10px;padding:0 3px}
  .sched-row,.sched-head,.sched2{grid-template-columns:44px repeat(var(--lanes,2),minmax(0,1fr))}
  .topbar-search{display:none}
  .grid-3>.wide{grid-column:auto}
  .card-head{flex-wrap:wrap}
}

/* ── CRM v2 (10/14) — 홈페이지 docs/07 anti-AI 규칙 · 색 B안을 e-HR 부품 위에 덮는다 ──
   흰 바탕 · 검정 글자와 주 버튼 · 민트 #C2E2D3는 선택 표시만 · 극연 민트 #EEF7F3는 한 화면 두 곳까지
   제목 마루 부리(네이버 배포 파일) · 본문 Noto Sans KR · 모서리 직각 · 알약 대신 글 · 상자 대신 1px 선 */
@font-face{font-family:'MaruBuri';src:url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Regular.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'MaruBuri';src:url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-SemiBold.woff2) format('woff2');font-weight:600;font-display:swap}

:root{
  --key:#C2E2D3;--mint-soft:#EEF7F3;--ink-2:#4d4d4d;--ink-3:#767676;--line:rgba(0,0,0,.12);--bar:#d6d6d6;
  --serif:"MaruBuri","Noto Serif KR",serif;
  /* e-HR 토큰 덮기 */
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --blue:#000;--blue-focus:#000;--blue-hover:#333;--blue-tint:rgba(0,0,0,.04);--blue-on-dark:#fff;
  --parchment:#fff;--pearl:#fff;--ink:#000;--ink-80:#222;--ink-48:#4d4d4d;--ink-24:#b3b3b3;
  --hairline:rgba(0,0,0,.12);--divider-soft:rgba(0,0,0,.12);--hover-1:rgba(0,0,0,.02);--hover-2:rgba(0,0,0,.04);--hover-3:rgba(0,0,0,.04);
  --ok:#000;--ok-bg:transparent;--wait:#000;--wait-bg:transparent;--bad:#b00020;--bad-bg:transparent;--neutral:#767676;--neutral-bg:transparent;
  --r-xs:0;--r-sm:0;--r-md:0;--r-lg:0;--r-pill:0;
  --fs-body:15px;--fs-ui:14px;--fs-caption:13px;--ctl-lg:48px;--ctl-md:40px;--ctl-sm:36px;
}
body{font-family:var(--font);color:#000;background:#fff;word-break:keep-all;-webkit-font-smoothing:antialiased}
.num,td.num{font-variant-numeric:tabular-nums}
.u{color:#000;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;white-space:nowrap;background:none;border:0;padding:0;font:inherit;font-size:14px;cursor:pointer}
.u:hover{text-decoration-thickness:2px}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.s13{font-size:13px;line-height:20px}

/* 틀 — 왼쪽 글자 메뉴 (사장님 제안 8개 · 아이콘 없음) */
.v2{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.v2-side{border-right:1px solid var(--line);padding:36px 0 28px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:#fff}
.v2-logo{display:block;height:17px;margin:0 28px 44px;color:#000}
.v2-logo svg{height:100%;width:auto;display:block}
.v2-nav a{display:block;padding:10px 28px;font-size:15px;line-height:22px;color:#000;text-decoration:none;position:relative}
.v2-nav a:hover{background:rgba(0,0,0,.03)}
.v2-nav a.on{font-weight:700}
.v2-nav a.on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:4px;background:var(--key)}
.v2-nav .gap{height:1px;background:var(--line);margin:14px 28px}
.v2-nav .n{font-size:12px;color:var(--ink-3);margin-left:6px;font-weight:400}
.v2-foot{margin-top:auto;padding:0 28px;font-size:12px;line-height:18px;color:var(--ink-3)}
.v2-main{padding:40px 56px 72px;min-width:0;max-width:1384px}
.v2-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:20px;border-bottom:1px solid #000;margin-bottom:32px}
.v2-head h1{font:600 32px/40px var(--serif);margin:0;letter-spacing:0}
.v2-lead{font-size:14px;line-height:22px;color:var(--ink-2);margin:6px 0 0}
.v2-crumb{font-size:13px;color:var(--ink-2);margin:0 0 8px}
.v2-crumb a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.v2-acts{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.v2-mbar,.v2-menu{display:none}
.v2-sub{display:flex;gap:32px;border-bottom:1px solid var(--line);margin:-12px 0 32px}
.v2-sub a{padding:0 0 12px;font-size:15px;color:var(--ink-2);text-decoration:none;position:relative}
.v2-sub a.on{color:#000;font-weight:700}
.v2-sub a.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#000}
h2.v2-h,.v2-h{font:600 20px/30px var(--serif);margin:0 0 12px;letter-spacing:0}
.v2-hrow{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin:0 0 12px}
.v2-hrow .v2-h{margin:0}

/* 버튼 — 주 버튼 검정 직각 (tiffany btn-primary) · 나머지는 밑줄 글자 */
.btn{border-radius:0;letter-spacing:0;font-weight:500}
.btn-primary{background:#000;color:#fff}
.btn-primary:hover:not(:disabled){background:#333}
.btn-pearl{background:#fff;color:#000;box-shadow:inset 0 0 0 1px #000}
.btn-pearl:hover:not(:disabled){background:rgba(0,0,0,.04);box-shadow:inset 0 0 0 1px #000}
.btn-link{color:#000;text-decoration:underline;text-underline-offset:4px}
.btn-lg{height:48px;padding:0 28px;font-size:14px}

/* 알약 → 글 (규칙 7) */
.badge{background:none!important;border-radius:0;padding:0;font-weight:400;font-size:13px;color:var(--ink-2)!important;gap:4px}
.badge-ink,.badge-ok{color:#000!important}
.badge-bad{color:var(--bad)!important}
.ch-naver,.ch-daangn,.ch-mrt,.ch-phone,.ch-biz{background:none;color:inherit}
.note-q{background:none;border-radius:0;padding:0;font-weight:500;color:var(--bad)}

/* 상자 → 선 */
.card{border:0;border-top:1px solid #000;border-radius:0;padding:20px 0 0}
.card-flush{padding:0}
.card-flush .card-head{padding:20px 0 0}
.card-title{font:600 20px/30px var(--serif)}
.banner{background:none;border-left:2px solid #000;border-radius:0;padding:4px 0 4px 14px;font-size:14px;line-height:22px;color:#000}
.kpi{border:0;border-top:1px solid #000;border-radius:0;padding:16px 0 0}
.kpi-value{font:600 40px/48px var(--serif)}
.kpi-unit{font:500 15px/1 var(--font);color:#000}
.kpi-label{color:var(--ink-2)}
.table th{color:var(--ink-2);font-weight:400;font-size:13px;border-bottom:1px solid #000;padding:0 16px 10px 0;background:#fff}
.table td{border-bottom:1px solid var(--line);padding:14px 16px 14px 0}
.table tr:last-child td{border-bottom:1px solid var(--line)}
.table td:last-child,.table th:last-child{padding-right:0}
.table-dense td{padding:10px 16px 10px 0}
.table-clickable tbody tr:hover td{background:rgba(0,0,0,.02)}
.tabs{background:none;border-radius:0;padding:0;gap:28px;border-bottom:1px solid var(--line)}
.tab{border-radius:0;height:auto;padding:0 0 12px;font-size:15px;color:var(--ink-2);position:relative;background:none}
.tab-active{background:none;color:#000;font-weight:700}
.tab-active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#000}
.tab-count{color:var(--ink-3);font-size:12px}
.input,.select,.textarea{border-radius:0;border-color:var(--line)}
.input:focus,.select:focus,.textarea:focus{border-color:#000;box-shadow:none}
.chip{border-radius:0;box-shadow:inset 0 0 0 1px var(--line)}
.chip.on,.chip[aria-pressed=true]{box-shadow:inset 0 0 0 1px #000;background:var(--key)}
.drawer{border-left:1px solid #000}
.drawer-head h2{font:600 22px/30px var(--serif)}
.toast{border-radius:0;background:#000}
.msg-bubble{border-radius:0;background:var(--mint-soft)}
.flow-step,.slot-img,.slot-val,.portal-note{border-radius:0}
.flow-col>h3 .n{border-radius:0}
.phone{border-radius:28px}
.dl dt{font-weight:400;color:var(--ink-2)}
.page-intro p{color:var(--ink-2)}

/* 홈 · 통계 · 업무 */
.ln{width:100%;border-collapse:collapse;font-size:14px;line-height:22px}
.ln th{font-weight:400;color:var(--ink-2);font-size:13px;text-align:left;padding:0 16px 10px 0;border-bottom:1px solid #000;white-space:nowrap}
.ln td{padding:14px 16px 14px 0;border-bottom:1px solid var(--line);vertical-align:top}
.ln td:last-child,.ln th:last-child{padding-right:0}
.ln .r{text-align:right}
.ln .t-time{width:64px}
.ln td.num{white-space:nowrap}
.ln td.tk-t .u{white-space:normal}
.kinds-m{display:none}
.home-top{display:grid;grid-template-columns:7fr 5fr;gap:56px}
.sendl{list-style:none;margin:0;padding:0}
.sendl li{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:14px 0;border-bottom:1px solid var(--line)}
.sendl li:first-child{border-top:1px solid #000}
.sendl b{font-size:15px;line-height:22px}
.sendl span{grid-column:1;font-size:13px;line-height:20px;color:var(--ink-2)}
.sendl .u{grid-row:1/3;grid-column:2;align-self:center}
.sendl .empty{display:block;color:var(--ink-3);font-size:14px}
.month{display:grid;grid-template-columns:5fr 7fr;gap:56px;margin-top:72px;padding-top:28px;border-top:1px solid #000}
.k-label{font-size:14px;color:var(--ink-2)}
.k-num{font:600 56px/64px var(--serif);margin:4px 0 2px}
.k-num small{font:500 18px/1 var(--font);margin-left:4px}
.k-cmp{font-size:13px;color:var(--ink-2)}
.bars{display:flex;align-items:flex-end;gap:14px;height:96px;margin-top:24px}
.bars div{flex:0 0 22px;background:var(--bar)}
.bars div.part{background:repeating-linear-gradient(135deg,var(--bar) 0 4px,#fff 4px 7px)}
.bars-x{display:flex;gap:14px;margin-top:6px}
.bars-x span{flex:0 0 22px;font-size:11px;color:var(--ink-3);text-align:center}
.spec{width:100%;border-collapse:collapse;font-size:14px;line-height:22px}
.spec td{padding:16px 16px 16px 0;border-bottom:1px solid var(--line);vertical-align:baseline}
.spec td:first-child{width:180px;color:var(--ink-2)}
.spec .v{font:700 20px/28px var(--font);white-space:nowrap;width:110px}
.spec tr:first-child td{border-top:1px solid #000}
.tasks{margin-top:48px}
.chk{width:20px;height:20px;border:1.5px solid #000;background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;vertical-align:-4px}
.chk[aria-checked=true]::after{content:"";width:10px;height:5px;border-left:2px solid #000;border-bottom:2px solid #000;transform:rotate(-45deg) translate(1px,-1px)}
tr.done td{color:var(--ink-3)}
tr.done td.tk-t{text-decoration:line-through}

.stat-top{display:grid;grid-template-columns:4fr 8fr;gap:56px}
.chart{display:flex;align-items:flex-end;gap:18px;height:180px;border-bottom:1px solid #000;padding:0 4px}
.chart button{flex:1;background:var(--bar);position:relative;border:0;padding:0;cursor:pointer}
.chart button b{position:absolute;top:-22px;left:0;right:0;text-align:center;font:500 12px/1 var(--font);color:var(--ink-2)}
.chart button.sel{background:#000}
.chart button.sel b{color:#000;font-weight:700}
.chart button.part{background:repeating-linear-gradient(135deg,var(--bar) 0 4px,#fff 4px 7px)}
.chart-x{display:flex;gap:18px;padding:6px 4px 0}
.chart-x span{flex:1;text-align:center;font-size:12px;color:var(--ink-3)}
.chart-x span.sel{color:#000;font-weight:700}
.mnav2{display:flex;align-items:center;gap:16px;font-size:15px;font-weight:700}
.arw{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;cursor:pointer;padding:0}
.arw::before{content:"";width:8px;height:8px;border-left:1.5px solid #000;border-bottom:1.5px solid #000;transform:rotate(45deg) translate(1px,-1px)}
.arw.nx::before{transform:rotate(-135deg) translate(1px,-1px)}
.arw:disabled{opacity:.3;cursor:default}
.stat .ln th:not(:first-child),.stat .ln td:not(:first-child){text-align:right;padding-left:16px;padding-right:16px}
.stat .ln td:first-child{width:280px}
.stat .ln th.sel{color:#000;font-weight:700;box-shadow:inset 0 -2px 0 #000}
.stat .ln td.sel{font-weight:700}
.stat .ln td.src,.stat .ln th.src{text-align:left;color:var(--ink-2);font-size:13px;width:240px;padding-right:0}
.stat .v2-h{margin-top:56px}
.exm{font:400 12px/1 var(--font);color:var(--ink-3);margin-left:8px}

/* 예약문자 */
.msg{display:grid;grid-template-columns:400px minmax(0,1fr);gap:56px}
.fld{margin-bottom:22px}
.fld>label,.fld>.lab{display:block;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kinds{border-top:1px solid #000}
.kinds .grp{font-size:12px;color:var(--ink-3);padding:14px 12px 4px}
.kinds label{display:flex;align-items:center;gap:12px;padding:9px 12px;font-size:15px;line-height:22px;cursor:pointer}
.kinds label:hover{background:rgba(0,0,0,.03)}
.kinds input,.rad input{appearance:none;width:16px;height:16px;border:1.5px solid #000;border-radius:50%;flex:0 0 16px;margin:0;display:grid;place-content:center;cursor:pointer}
.kinds input:checked::after,.rad input:checked::after{content:"";width:8px;height:8px;border-radius:50%;background:#000}
.kinds label.on{background:var(--key);font-weight:700}
.kinds .wait{font-size:12px;color:var(--ink-3);font-weight:400;margin-left:auto}
.rad{display:flex;gap:28px;height:48px;align-items:center;font-size:15px}
.rad label{display:flex;align-items:center;gap:8px;cursor:pointer}
.out{width:100%;background:#fff;border:1px solid var(--line);border-radius:0;padding:28px 32px;font:400 15px/26px var(--font);color:#000;min-height:480px;resize:vertical;white-space:pre-wrap}
.out:focus{outline:1px solid #000}
.out.is-empty{color:var(--ink-3)}
.out-foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:24px}
.out-foot p{margin:0;max-width:520px}

/* 고객 한 페이지 */
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:56px}
.kvl div{display:grid;grid-template-columns:140px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:22px}
.kvl div:first-child{border-top:1px solid var(--line)}
.kvl div>span:first-child{color:var(--ink-2)}
.pass{border-top:1px solid #000;padding-top:16px;align-self:start}
.ctabs{margin:48px 0 20px}
.v2-nav a.no-meet,.v2-menu a.no-meet{font-size:13px;color:var(--ink-3);margin-top:12px}
.burger[aria-expanded=true] i:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
.burger[aria-expanded=true] i:nth-child(2){opacity:0}
.burger[aria-expanded=true] i:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
.burger i{transition:transform var(--dur-2) var(--ease),opacity var(--dur-2) var(--ease)}
@media (prefers-reduced-motion:reduce){.burger i{transition:none}}

/* 모바일 — 위 막대 + 글자 메뉴 (홈페이지 모바일 메뉴와 같은 짜임) */
@media (max-width:860px){
  .v2{display:block}
  .v2-side{display:none}
  .v2-mbar{display:flex;height:56px;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:20}
  .v2-mbar .v2-logo{margin:0;height:14px}
  .burger{width:40px;height:40px;margin-right:-8px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;background:none;border:0;cursor:pointer}
  .burger i{display:block;width:24px;height:1.5px;background:#000}
  .v2-menu.open{display:block;position:fixed;inset:56px 0 0;background:#fff;z-index:30;padding:12px 20px 40px;overflow-y:auto}
  .v2-menu a{display:block;padding:16px 0;border-bottom:1px solid var(--line);font-size:18px;line-height:26px;color:#000;text-decoration:none}
  .v2-menu a.on{font-weight:700;box-shadow:inset 4px 0 0 var(--key);padding-left:16px}
  .v2-menu .v2-foot{margin-top:28px;padding:0}

<script>const MEETING = true;
/* ── v3 (10/14): 공개판 데모 시계 — 실제 오늘 날짜와 지금 시각으로 움직인다.
   검사 · 캡처는 ?today=2026-09-14&now=10:00 처럼 고정한다 ── */
const V3 = true;
const V3_Q = new URLSearchParams(location.search);
const v3pad = n => String(n).padStart(2, '0');
const V3_TODAY = (() => { const q = V3_Q.get('today'); if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) return q; const d = new Date(); return `${d.getFullYear()}-${v3pad(d.getMonth() + 1)}-${v3pad(d.getDate())}`; })();
const V3_NOW = V3_TODAY + ' ' + (() => { const q = V3_Q.get('now'); if (q && /^\d{2}:\d{2}$/.test(q)) return q; const d = new Date(); return `${v3pad(d.getHours())}:${v3pad(d.getMinutes())}`; })();

;
/* ── 가상 데이터 — 인물 · 연락처 · 기록 전부 가상. 사장님 노션 구조(A~E)의 데이터 모델을 따른다 ── */
const SEED_DAY = '2026-09-14'; // 가상 데이터를 만든 날 — v3 공개판은 실제 오늘로 옮긴다(v3_pre.js · 맨 아래 shiftSeed)
const TODAY = typeof V3_TODAY !== 'undefined' ? V3_TODAY : SEED_DAY;

function laneFor(date, time, pid, skipId) { // 이 시각에 이 메뉴를 시작할 수 있으면 빈 원장 id, 아니면 null

  return s ? s.id : null;
}

const depDue = r => { const s = MSGLOG.filter(l => l.cid === r.cid && l.key === 'T_DEPOSIT_GUIDE_FIRST_VISIT').map(l => l.at).sort().pop(); return s ? addHours(s, DEP_HOURS) : null; };
const depOverdue = r => r.status === 'DEPOSIT_PENDING' && !!depDue(r) && depDue(r) < NOW;
const fmtAt = at => at ? `${Number(at.slice(5, 7))}.${Number(at.slice(8, 10))} ${at.slice(11)}` : '–';

// 구분은 자동 (설계서 F6): 회원권 → VIP · 6개월 이상 미방문 → 휴면 · 방문 0~1회 → 신규 · 그 외 일반
const segOf = c => (c.pass && c.pass.left > 0) ? 'VIP' : (c.last && diffDays(c.last, TODAY) >= 180) ? 'DORMANT' : c.visits <= 1 ? 'NEW' : '일반';
CUSTOMERS.forEach(c => { c.seg = segOf(c); });

// 저장 도구 — 데모는 메모리에만 남는다
const nextId = (arr, p) => p + (Math.max(0, ...arr.map(x => Number(String(x.id).slice(p.length)) || 0)) + 1);
function logMsg(cid, key, note) { // 연락처가 없으면 보내지 않고 "앱 채팅으로 직접"으로 남긴다
  const c = cust(cid), t = TEMPLATES.find(x => x.key === key);
  if (!c.phone) { MSGLOG.push(L(NOW, cid, key, '앱 채팅', 'HELD', '연락처 없음 → 앱 채팅으로 직접' + (note ? ' · ' + note : ''))); return false; }
  MSGLOG.push(L(NOW, cid, key, t.via, 'SENT', note || ''));
  return true;
}
const pendingList = () => RESV.filter(r => r.status === 'REQUESTED' || r.status === 'DEPOSIT_PENDING');
const hasRebook = (cid, after) => RESV.some(r => r.cid === cid && r.date > after && ['CONFIRMED', 'DEPOSIT_PENDING', 'REQUESTED'].includes(r.status));

// 오늘 보낼 안내 — 2절 C의 트리거를 오늘 날짜에 대입. 재방문·휴면은 광고성이라 수신 동의 고객에게 문자(광고)로
function buildQueue() {
  const out = [];
  const push = (key, cid, when, state, via, reason) => {
    if (state === 'send' && !cust(cid).phone) { state = 'manual'; via = '앱 채팅'; reason += ' · 연락처 없음 → 앱에서 직접'; }
    out.push({ key, cid, when, state, via, reason });
  };
  if (!MEETING) RESV.filter(r => r.status === 'CONFIRMED' && r.date === addDays(TODAY, 1))
    .forEach(r => push('T_D_MINUS_1', r.cid, '오늘 20:00', 'send', '알림톡', `${fmtD(r.date)} ${r.time} 예약`));
  RESV.filter(r => r.status === 'VISIT_COMPLETED' && r.first).forEach(r => {
    const d = diffDays(r.date, TODAY), c = cust(r.cid);
    if (d === 1) push('T_POSTCARE_PORTAL_NEXT_DAY', r.cid, '오늘 10:00', c.portal ? 'send' : 'held', '알림톡', c.portal ? '어제 첫 방문' : '포털 링크 없음 → 대체 문구 또는 보류');
    if (d === 2 || d === 3) push('T_REVIEW_REQUEST_2_3D', r.cid, '오늘 13:00', 'send', '알림톡', `${d}일 전 첫 방문${c.portal ? '' : ' · 포털 링크 빼고'}`);
  });
  const lastVisit = {};
  RESV.filter(r => r.status === 'VISIT_COMPLETED').forEach(r => { if (!lastVisit[r.cid] || r.date > lastVisit[r.cid]) lastVisit[r.cid] = r.date; });
  Object.entries(lastVisit).forEach(([cid, date]) => {
    const d = diffDays(date, TODAY), c = cust(cid), rebook = hasRebook(cid, date);
    const rule = d === 15 ? 'T_FOLLOWUP_15D' : d === 30 ? 'T_FOLLOWUP_30D' : (d >= 90 && d <= 92) ? 'T_FOLLOWUP_3M' : null;
    if (!rule || c.seg === 'VIP') return;
    if (rebook) return push(rule, cid, '–', 'skip', '문자(광고)', '재예약 있음 → 자동 중단');
    if (rule === 'T_FOLLOWUP_30D') return push(rule, cid, '–', 'held', '문자(광고)', '노션 문구 비어 있음' + (c.consent ? '' : ' · 수신 동의 없음'));
    push(rule, cid, '오늘 11:00', c.consent ? 'send' : 'blocked', '문자(광고)', c.consent ? `마지막 방문 ${fmtD(date)}` : '광고 수신 동의 없음 → 보낼 수 없음');
  });
  CUSTOMERS.filter(c => c.seg === 'DORMANT').forEach(c => {
    const m = Math.floor(diffDays(c.last, TODAY) / 30);
    if (m >= 6 && m <= 12) push('T_DORMANT_6_12M', c.id, '이번 주', c.consent ? 'send' : 'blocked', '문자(광고)', `${m}개월 미방문${c.consent ? '' : ' · 수신 동의 없음'}`);
  });
  return out;
}

function schedHTML(date) { // 30분 칸 격자 — 예약은 소요시간만큼 세로로, 빈 칸을 누르면 그 시간으로 예약 등록

    const c = cust(r.cid), p = prog(r.pid), i0 = sIdx(r.time), n = span(r.pid), col = lanes.findIndex(s => s.id === r.lane) + 2;

    out.push(`<button class="sched-cell ${CHANNELS[r.ch].cls}${r.status === 'VISIT_COMPLETED' ? ' is-done' : ''}" style="grid-row:${i0 + 1} / span ${n};grid-column:${col}" data-act="resv" data-id="${r.id}">
      <span class="t">${esc(c.name)} · ${esc(p.name)}</span><span class="s">${r.time} · ${p.min}분 · ${CHANNELS[r.ch].short}${r.status === 'DEPOSIT_PENDING' ? ' · 예약금 대기' : ''}</span></button>`);
  });
  SLOTS.forEach((t, i) => lanes.forEach((s, j) => {
    if (taken.has(`${i}|${s.id}`)) return;
    const pos = `style="grid-row:${i + 1};grid-column:${j + 2}"`;
    out.push(open ? `<button class="sched-free" ${pos} data-act="book" data-d="${date}" data-t="${t}" aria-label="${t} ${s.name} 빈자리에 예약"></button>` : `<span class="sched-free" ${pos}></span>`);
  }));
  const req = resvOn(date).filter(r => r.status === 'REQUESTED');
  return `<div style="--lanes:${CAP}"><div class="sched-head"><span></span>${lanes.map(s => `<span>${s.name}</span>`).join('')}</div>

}

}

  if (tm.length) rows.push({ kid: 'd1', ids: tm.map(r => r.cid), why: `내일 방문 ${tm.length}명` });
  const map = { T_POSTCARE_PORTAL_NEXT_DAY: 'check', T_REVIEW_REQUEST_2_3D: 'thanks', T_FOLLOWUP_15D: 'revisit', T_FOLLOWUP_3M: 'revisit', T_DORMANT_6_12M: 'revisit' };
  const why = { check: '어제 첫 방문한 ', thanks: '2~3일 전 첫 방문한 ', revisit: '광고 수신에 동의한 ' };
  const q = buildQueue().filter(x => x.state === 'send');
  ['check', 'thanks', 'revisit'].forEach(kid => {
    const ids = [...new Set(q.filter(x => map[x.key] === kid).map(x => x.cid))];
    if (ids.length) rows.push({ kid, ids, why: why[kid] + names(ids) });
  });
  return rows;
}
const mAdd = (m, n) => { const d = new Date(Number(m.slice(0, 4)), Number(m.slice(5, 7)) - 1 + n, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };

  return { done: VISITS.filter(v => inM(v.date)).length, first: firsts.length,
    back: firsts.filter(r => VISITS.some(v => v.cid === r.cid && v.date > r.date && diffDays(r.date, v.date) <= 30)).length,
    pass: 0, noshow: RESV.filter(r => ['NO_SHOW', 'CANCELED'].includes(r.status) && inM(r.date)).length };
}

  return cls === 'chart'
    ? `<div class="chart">${MONTHS.map(bar).join('')}</div><div class="chart-x">${MONTHS.map(m => `<span class="${m === sel ? 'sel' : ''}">${mName(m)}${m === THIS_M ? ` ${UPTO}일까지` : ''}</span>`).join('')}</div>`
    : `<div class="bars">${MONTHS.map(bar).join('')}</div><div class="bars-x">${MONTHS.map(m => `<span>${mName(m)}</span>`).join('')}</div>`;
}

    const fr = new FileReader();

    fr.readAsDataURL(file);

}

// 고객 등록 · 수정 — 전체 번호를 저장하고(화면에서만 가림), 같은 번호가 있으면 막는다 (평가 CRM-07 · 08)
ACTIONS['cf-save'] = el => {
  const f = n => $(`#cf [name=${n}]`), name = f('name').value.trim(), raw = isMgr() && el.dataset.id ? cust(el.dataset.id).phone : f('phone').value.trim(), phone = raw ? normPhone(raw) : '';
  const err = (msg, n) => { $('#cf-err').innerHTML = `<p class="ferr" role="alert">${msg}</p>`; if (n) { f(n).setAttribute('aria-invalid', 'true'); f(n).focus(); } };
  if (!name) return err('이름을 넣으세요.', 'name');
  if (raw && !phone) return err('연락처 형식을 확인하세요. 예: 010-1234-5678', 'phone');
  const dup = phone && CUSTOMERS.find(x => x.phone === phone && x.id !== el.dataset.id);
  if (dup) return err(`같은 번호로 등록된 고객이 있습니다: <a class="u" href="#/customer/${dup.id}">${esc(dup.name)}</a>. 같은 사람이면 그 고객을 고쳐 주세요.`, 'phone');
  let c = el.dataset.id ? cust(el.dataset.id) : null;
  if (!c) { c = { id: nextId(CUSTOMERS, 'c'), first: null, last: null, visits: 0, pass: null, portal: false }; CUSTOMERS.push(c); }
  const consent = f('consent').checked;
  Object.assign(c, { name, phone, age: f('age').value, ch: f('ch').value, bday: f('bday').value.trim(), memo: f('memo').value.trim(), consentCheck: false, staff: f('staff') ? f('staff').value : (c.staff || '') });
  if (consent && !c.consent) { c.consentAt = TODAY; c.consentHow = f('how').value; }
  if (!consent) { c.consentAt = ''; c.consentHow = ''; }
  c.consent = consent;
  if (f('pass').value) c.pass = { type: `${f('pass').value}회권`, left: Number(f('pass').value) };
  c.seg = segOf(c);
  closeDrawer();
  toast(el.dataset.id ? '고객 정보를 고쳤습니다' : '고객을 등록했습니다');
  location.hash = '#/customer/' + c.id; renderRoute();
};

    <div class="kvl"><div><span>날짜</span><span>${fmtD(v.date)}</span></div><div><span>담당</span><span>${esc(staffName(v.staff)) || '–'}</span></div><div><span>프로그램</span><span>${esc(prog(v.pid).name)}</span></div>
      <div><span>아로마</span><span>${esc(v.aroma || '–')}</span></div><div><span>다음 방문 권유</span><span>${v.next ? fmtD(v.next) + ' 전후' : '정하지 않음'}</span></div>${v.deducted ? '<div><span>회원권</span><span>이 회차에 1회 차감</span></div>' : ''}</div>
    <h3 class="rec-h">고객 페이지에 보이는 것</h3>
    <p class="vd-l">담당 한마디</p><p>${esc(v.note) || '<span class="dim">없음</span>'}</p>
    <p class="vd-l">사진</p>${ph.length ? `<div class="vd-ph">${ph.map(x => `<figure><img src="${phSrc(x)}" alt="${x.k === 'b' ? '케어 전' : '케어 후'} 사진"><figcaption>${x.k === 'b' ? '케어 전' : '케어 후'}${isExPhoto(x) ? ', 예시' : ', 올린 사진'}</figcaption></figure>`).join('')}</div>` : '<p class="dim">없음</p>'}
    <p class="vd-l">측정 결과</p>${mm.length ? `<div class="kvl">${mm.map(([l, x]) => `<div><span>${l}</span><span>${esc(x)}</span></div>`).join('')}</div>` : '<p class="dim">없음</p>'}
    <p class="vd-l">홈케어</p>${(v.home || []).length ? `<ul class="vd-hc">${v.home.map(h => `<li>${esc(h)}</li>`).join('')}</ul>` : '<p class="dim">없음</p>'}
    <h3 class="rec-h">고객에게 안 보이는 것</h3><p class="vd-l">내부 메모</p><p>${esc(v.memo) || '<span class="dim">없음</span>'}</p></div>`,
    `<span id="vd-foot">${isMgr() ? '' : `<button type="button" class="u" data-act="v-del" data-vid="${v.id}">이 회차 지우기</button>`}<button type="button" class="btn btn-pearl" data-act="close">닫기</button><button type="button" class="btn btn-primary" data-act="rec-open" data-vid="${v.id}">수정</button></span>`, 560);
};
ACTIONS['v-del'] = el => {
  if (ownerOnly()) return;
  const v = VISITS.find(x => x.id === el.dataset.vid);
  $('#vd-foot').innerHTML = `<span class="vd-ask">${v.no}회차를 지울까요?${v.deducted ? ' 차감한 회원권 1회도 돌려놓습니다.' : ''}</span><button type="button" class="btn btn-pearl" data-act="v-open" data-vid="${v.id}">취소</button><button type="button" class="btn btn-primary" data-act="v-del-yes" data-vid="${v.id}">지우기</button>`;
};
ACTIONS['v-del-yes'] = el => {
  if (ownerOnly()) return;
  const v = VISITS.find(x => x.id === el.dataset.vid), c = cust(v.cid), idx = VISITS.indexOf(v);
  const snap = { v, idx, cid: c.id, no: v.no, prevC: { visits: c.visits, last: c.last, first: c.first, pass: c.pass ? { ...c.pass } : null }, shifted: [], resv: null };
  VISITS.splice(idx, 1);
  VISITS.filter(x => x.cid === c.id && x.no > v.no).forEach(x => { x.no -= 1; snap.shifted.push(x.id); });
  c.visits = Math.max(0, c.visits - 1);
  const rest = VISITS.filter(x => x.cid === c.id).map(x => x.date).sort();
  if (rest.length) c.last = rest[rest.length - 1]; else if (!c.visits) { c.last = null; c.first = null; }
  if (v.deducted && c.pass) c.pass.left += 1;
  const r = RESV.find(x => x.cid === c.id && x.date === v.date && x.status === 'VISIT_COMPLETED'); if (r) { r.status = 'CONFIRMED'; snap.resv = r.id; }
  c.seg = segOf(c); STATE.delUndo = snap; STATE.ctab = '회차';
  closeDrawer(); if (location.hash !== '#/customer/' + c.id) location.hash = '#/customer/' + c.id; else redraw();
  toast(`${snap.no}회차 기록을 지웠습니다`);
};
ACTIONS['v-del-undo'] = () => {
  const u = STATE.delUndo; if (!u) return;
  VISITS.splice(u.idx, 0, u.v); VISITS.filter(x => u.shifted.includes(x.id)).forEach(x => { x.no += 1; });
  Object.assign(cust(u.cid), u.prevC); if (u.resv) RESV.find(x => x.id === u.resv).status = 'VISIT_COMPLETED';
  cust(u.cid).seg = segOf(cust(u.cid)); STATE.delUndo = null; redraw(); toast('지운 회차를 되돌렸습니다');
};

// ── 고객 등록 · 수정 서랍 (v3: 담당 · 동의 날짜 · 지우기) ──
openCustForm = function (cid) {
  const c = cid ? cust(cid) : { name: '', phone: '', age: '30대', ch: 'phone', consent: false, consentHow: '', bday: '', memo: '', pass: null, staff: '' };
  const opt = (v, l, cur) => `<option value="${v}"${v === cur ? ' selected' : ''}>${l}</option>`;
  openDrawer(cid ? `정보 수정 · ${esc(c.name)}` : '고객 등록', `<div id="cf">
    <div class="two"><div class="fld"><label for="cf-n">이름</label><input id="cf-n" class="input" name="name" value="${esc(c.name)}"></div>
      <div class="fld"><label for="cf-p">연락처</label><input id="cf-p" class="input" name="phone" inputmode="tel" value="${esc(isMgr() ? showPhone(c.phone) : c.phone)}" placeholder="010-0000-0000"${isMgr() && cid ? ' readonly' : ''}></div></div>
    <div class="two"><div class="fld"><label for="cf-a">연령대</label><select id="cf-a" class="input select" name="age">${AGES.map(a => opt(a, a, c.age)).join('')}</select></div>
      <div class="fld"><label for="cf-c">처음 온 곳</label><select id="cf-c" class="input select" name="ch">${Object.entries(CHANNELS).map(([k, v]) => opt(k, v.name, c.ch)).join('')}${CHANNELS[c.ch] ? '' : opt(c.ch, esc(c.ch || '–'), c.ch)}</select></div></div>
    <div class="two"><div class="fld"><label for="cf-s">담당</label><select id="cf-s" class="input select" name="staff">${opt('', '정하지 않음', c.staff || '')}${STAFF3.filter(s => s.active || s.id === c.staff).map(s => opt(s.id, esc(s.name), c.staff || '')).join('')}</select></div>
      <div class="fld"><label for="cf-b">생일 (선택)</label><input id="cf-b" class="input" name="bday" value="${esc(c.bday || '')}" placeholder="09-14"></div></div>
    <div class="fld"><label for="cf-r">회원권</label><select id="cf-r" class="input select" name="pass">${opt('', c.pass ? `그대로 (${c.pass.type}, ${c.pass.left}회 남음)` : '없음', '')}${opt('10', '10회권 새로 등록', '')}${opt('20', '20회권 새로 등록', '')}</select></div>
    <fieldset class="fld"><legend>광고 수신 동의</legend><label class="ck"><input type="checkbox" name="consent"${c.consent ? ' checked' : ''}> 재방문 안내, 계절 인사 같은 광고 문자를 받겠다고 동의함</label>
      <div class="fld" style="margin:8px 0 0"><label for="cf-h">받은 방법</label><select id="cf-h" class="input select" name="how">${['첫 방문 문진표', '카카오톡', '구두'].map(h => opt(h, h, c.consentHow || '첫 방문 문진표')).join('')}</select></div>
      <p class="s13 muted" style="margin:6px 0 0">${c.consent && c.consentAt ? `${fmtDY(c.consentAt)}에 동의받았습니다. ` : ''}체크를 풀면 광고 문자 명단에서 바로 빠집니다.</p></fieldset>
    <div class="fld"><label for="cf-m">메모</label><textarea id="cf-m" class="textarea" name="memo" rows="2">${esc(c.memo || '')}</textarea></div>
    <div id="cf-err"></div>
    ${cid && !isMgr() ? `<button type="button" class="u" data-act="cust-del" data-id="${cid}">이 고객 지우기</button>` : ''}
  </div>`, `<button type="button" class="btn btn-pearl" data-act="close">닫기</button><button type="button" class="btn btn-primary" data-act="cf-save" data-id="${cid || ''}">저장</button>`, 600);
};
ACTIONS['cust-del'] = el => {
  if (ownerOnly()) return;
  const c = cust(el.dataset.id);
  if (!confirm(`${c.name}님과 회차 기록, 문자 기록을 모두 지웁니다. 계속할까요?`)) return;
  const snap = { c, ci: CUSTOMERS.indexOf(c), visits: VISITS.filter(v => v.cid === c.id), logs: MSGLOG.filter(l => l.cid === c.id), resv: RESV.filter(r => r.cid === c.id) };
  [[CUSTOMERS, x => x.id === c.id], [VISITS, x => x.cid === c.id], [MSGLOG, x => x.cid === c.id], [RESV, x => x.cid === c.id]].forEach(([a, f]) => { for (let i = a.length - 1; i >= 0; i--) if (f(a[i])) a.splice(i, 1); });
  STATE.custUndo = snap; closeDrawer(); location.hash = '#/customers'; toast(`${c.name}님을 지웠습니다`);
};
ACTIONS['cust-del-undo'] = () => {
  const u = STATE.custUndo; if (!u) return;
  CUSTOMERS.splice(u.ci, 0, u.c); VISITS.push(...u.visits); MSGLOG.push(...u.logs); RESV.push(...u.resv);
  STATE.custUndo = null; redraw(); toast(`${u.c.name}님을 되돌렸습니다`);
};

;
/* ── v3 움직임 (10/14 밤, 대표 "고객 관리 · 컨디션포털에 애니메이션이 전혀 없다")
   홈페이지 규칙(docs/07 3-3 움직임)과 같다: 0.2~0.3초 · 곡선 하나(--ease) · 누른 것에 대한 반응만 ·
   스크롤 등장 효과 · 숫자 올라가기는 넣지 않는다 · 기기의 "동작 줄이기"면 전부 바로 바뀐다.
   화면은 누를 때마다 다시 그려지므로, 화면 · 탭 · 선택이 실제로 바뀐 때만 움직이게 앞뒤를 비교한다 ── */
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const MOVE = () => !RM.matches;
const DROP = ['.undo-bar', '.mgr-bar', '.donemsg', '.edited', '.qbar', '.why:not(.none)'];
const relBox = a => a ? { l: a.offsetLeft, w: a.offsetWidth } : null;
let motionKey = '', motionSub = '';

const _rrMotion = renderRoute;
renderRoute = function () {
  const key = (location.hash || '#/') + '|' + (STATE.role || '');
  const sub = [STATE.ctab, STATE.seg, STATE.sm].join('|');
  const prevSel = new Set([...document.querySelectorAll('#root [data-selg]')].map(e => e.dataset.selg));
  const prevGroups = new Set([...prevSel].map(s => s.split(':')[0]));
  const prevDrop = new Set(DROP.filter(s => document.querySelector('#root ' + s)));
  const prevTabs = [...document.querySelectorAll('#root nav.v2-sub')].map(n => ({ sig: [...n.querySelectorAll('a')].map(a => a.textContent).join('|'), box: relBox(n.querySelector('a.on')) }));
  _rrMotion();
  const routeChanged = key !== motionKey, subChanged = !routeChanged && sub !== motionSub;
  motionKey = key; motionSub = sub;
  if (!MOVE()) return;
  const view = $('#view');
  if (routeChanged) { view.classList.add('is-enter'); $('#v2head').classList.add('is-enter-h'); }
  else if (subChanged) view.querySelectorAll('.ctabs ~ *, .ctbl, .stat').forEach(e => e.classList.add('is-enter')); // 탭 아래 내용만 옅게 올라온다 (홈페이지 3번)
  // 탭 밑줄이 누른 탭으로 옮겨 간다 (홈페이지 3번)
  document.querySelectorAll('#root nav.v2-sub').forEach(n => {
    const sig = [...n.querySelectorAll('a')].map(a => a.textContent).join('|'), was = prevTabs.find(t => t.sig === sig), now = relBox(n.querySelector('a.on'));
    if (!was || !was.box || !now || was.box.l === now.l) return;
    const ind = document.createElement('i'); ind.className = 'tab-ind'; ind.style.left = was.box.l + 'px'; ind.style.width = was.box.w + 'px';
    n.classList.add('ind-run'); n.appendChild(ind);
    const end = () => { n.classList.remove('ind-run'); ind.remove(); };
    requestAnimationFrame(() => requestAnimationFrame(() => { ind.style.left = now.l + 'px'; ind.style.width = now.w + 'px'; }));
    ind.addEventListener('transitionend', end, { once: true }); setTimeout(end, 450);
  });
  if (routeChanged) return;
  // 고른 것이 바뀌면 그 줄만 옅게 칠해진다 (안내 종류 · 컨디션포털 고객 · 고객 구분)
  document.querySelectorAll('#root [data-selg]').forEach(e => {
    const v = e.dataset.selg, g = v.split(':')[0];
    if (prevSel.has(v) || !prevGroups.has(g)) return;
    e.classList.add('a-sel');
    if (g === 'kind') { const t = $('#cmp-out'); if (t) t.classList.add('a-fade'); }
    if (g === 'psel') { const c = $('.pv-col'); if (c) c.classList.add('is-enter'); const r = $('.pm-row'); if (r) r.classList.add('a-drop'); }
  });
  DROP.forEach(s => { if (!prevDrop.has(s)) { const e = document.querySelector('#root ' + s); if (e) e.classList.add('a-drop'); } });
};

// 서랍: 닫을 때도 옅어지며 물러난다. 서랍을 바로 바꿔 열 때(저장 뒤 화면)는 다시 미끄러지지 않는다
const _closeDrawer = closeDrawer, _openDrawer = openDrawer;
closeDrawer = function () {
  const o = $('#overlay-root .overlay');
  document.body.style.overflow = '';
  if (!o || !MOVE()) return _closeDrawer();
  o.dataset.state = 'closed';
  setTimeout(() => { if (o.isConnected) o.remove(); }, 220);
};
openDrawer = function (...a) {
  const had = !!$('#overlay-root .overlay');
  _openDrawer(...a);
  if (had) $('#overlay-root .overlay').classList.add('no-anim');
};

;
/* ── v3 저장: 이 브라우저(localStorage)에만 남긴다. 서버로 가지 않는다 (10/14 대표 결정) ──
   main.js 바로 앞에 붙는다 — 모든 화면 코드가 데이터를 만든 뒤 저장본으로 바꿔 끼운다 */
const STORE_KEY = 'mb-crm-v3';
const ARRS = { CUSTOMERS, RESV, VISITS, MSGLOG, TASKS, BATCHES, STAFF3 };
function snapshot() { return { app: 'mb-crm', ver: 3, at: NOW, ...ARRS, NAVER, SHOP, META }; }
function restore(d) {
  Object.entries(ARRS).forEach(([k, a]) => { if (Array.isArray(d[k])) a.splice(0, a.length, ...d[k]); });
  if (d.NAVER) { Object.keys(NAVER).forEach(k => delete NAVER[k]); Object.assign(NAVER, d.NAVER); }
  if (d.SHOP) Object.assign(SHOP, d.SHOP, { texts: Object.assign({}, d.SHOP.texts) });
  if (d.META) Object.assign(META, d.META);
  // 앞선 v3 저장본(담당자 · 회차 id 없음)도 읽히게
  VISITS.forEach(v => { if (!v.id) v.id = nextId(VISITS, 'v'); if (!v.staff) v.staff = 'a'; });
  CUSTOMERS.forEach(c => { if (c.staff === undefined) { const lv = lastVisitOf(c.id); c.staff = lv ? lv.staff : ''; } c.seg = segOf(c); });
}
let saveTimer = 0, saveWarned = false;
function saveNow() {
  clearTimeout(saveTimer);
  try { localStorage.setItem(STORE_KEY, JSON.stringify(snapshot())); }
  catch (e) { if (!saveWarned) { saveWarned = true; toast('이 브라우저에 저장하지 못했습니다. 사진이 많으면 공간이 모자랄 수 있습니다. 백업 파일을 받아 두세요'); } }
}
const saveSoon = () => { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); };
function wipeStore() { try { localStorage.removeItem(STORE_KEY); } catch (e) { /* 저장소를 못 쓰는 브라우저 */ } }
try { const raw = localStorage.getItem(STORE_KEY); if (raw) { const d = JSON.parse(raw); if (d && d.app === 'mb-crm') restore(d); } } catch (e) { /* 비공개 창 등 — 저장 없이 진행 */ }
['click', 'change', 'input'].forEach(t => document.addEventListener(t, saveSoon));
addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });

;
/* ── 시작: 클릭 · 입력 · 변경 위임 · 화면 전환 ── */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A') ev.preventDefault();
  fn(el, ev);
});
document.addEventListener('input', ev => {
  const el = ev.target.closest('[data-input]');
  if (el && INPUTS[el.dataset.input]) INPUTS[el.dataset.input](el, ev);
});
document.addEventListener('change', ev => {
  const el = ev.target.closest('[data-change]');
  if (el && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el, ev);
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeDrawer(); });
window.addEventListener('hashchange', renderRoute);
renderRoute();
</script>
</body>
</html>
