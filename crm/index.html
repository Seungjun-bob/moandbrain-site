/*$vite$:1*/
/* ── 모앤브레인 CRM 데모 — e-HR 디자인 시스템 위에 얹는 추가 스타일 ── */

/* 예약 채널 색 */
:root{--ch-naver:#e7f6ed;--ch-naver-ink:#0b7a3e;--ch-daangn:#fff0e5;--ch-daangn-ink:#b8520b;--ch-mrt:#e8f0fb;--ch-mrt-ink:#0a58ca;--ch-phone:#f0f0f2;--ch-phone-ink:#4a4a4f;--ch-biz:#f2ecfa;--ch-biz-ink:#6b3fa0}
.ch-naver{background:var(--ch-naver);color:var(--ch-naver-ink)}
.ch-daangn{background:var(--ch-daangn);color:var(--ch-daangn-ink)}
.ch-mrt{background:var(--ch-mrt);color:var(--ch-mrt-ink)}
.ch-phone{background:var(--ch-phone);color:var(--ch-phone-ink)}
.ch-biz{background:var(--ch-biz);color:var(--ch-biz-ink)}
.cal-item.is-pending{background:repeating-linear-gradient(135deg,#fff 0 6px,var(--pearl) 6px 12px);color:var(--ink-80);box-shadow:inset 0 0 0 1px var(--hairline)}
.cal-item.is-conflict{box-shadow:inset 0 0 0 1.5px var(--bad)}
.cal-item.is-done{opacity:.55}
.ch-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.ch-dot.ch-naver{background:var(--ch-naver-ink)}.ch-dot.ch-daangn{background:var(--ch-daangn-ink)}.ch-dot.ch-mrt{background:var(--ch-mrt-ink)}.ch-dot.ch-phone{background:var(--ch-phone-ink)}.ch-dot.ch-biz{background:var(--ch-biz-ink)}
.legend{display:inline-flex;flex-wrap:wrap;gap:6px 14px;font-size:var(--fs-caption);color:var(--ink-80)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* 하루 스케줄 — 시간 × 동시 관리 칸 */
.sched{display:flex;flex-direction:column}
.sched-row{display:grid;grid-template-columns:56px repeat(var(--lanes,2),minmax(0,1fr));gap:8px;padding:5px 0;border-bottom:1px solid var(--divider-soft);align-items:stretch}
.sched-row:last-child{border-bottom:0}
.sched-time{font-size:var(--fs-caption);color:var(--ink-48);font-variant-numeric:tabular-nums;padding-top:9px}
.sched-cell{border-radius:var(--r-sm);padding:7px 10px;font-size:13px;line-height:1.35;min-height:40px;min-width:0;overflow:hidden;text-align:left}
.sched-cell .t{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sched-cell .s{font-size:12px;opacity:.85;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sched-free{box-shadow:inset 0 0 0 1px var(--hairline);color:var(--ink-24);display:flex;align-items:center}
.sched-head{display:grid;grid-template-columns:56px repeat(var(--lanes,2),minmax(0,1fr));gap:8px;font-size:var(--fs-caption);color:var(--ink-48);font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--hairline)}

.sched2{display:grid;grid-template-columns:56px repeat(var(--lanes,2),minmax(0,1fr));grid-auto-rows:30px;gap:3px 8px;padding-top:6px}
.sched2 .sched-cell{min-height:0;height:100%;padding:5px 10px}
.sched2 .sched-free{border-radius:6px;box-shadow:inset 0 0 0 1px var(--divider-soft);background:transparent}
.sched2 button.sched-free{cursor:pointer}
.sched2 button.sched-free:hover{background:var(--blue-tint);box-shadow:inset 0 0 0 1px var(--blue-focus)}
.sched2 .sched-time{padding-top:0;line-height:30px}

/* 자동 안내 흐름 */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.flow-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.flow-col>h3{font-size:var(--fs-ui);color:var(--ink-48);font-weight:600;display:flex;align-items:center;gap:8px}
.flow-col>h3 .n{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.flow-step{border:1px solid var(--hairline);border-radius:var(--r-md);padding:12px 14px;background:var(--canvas);display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;transition:background-color var(--dur-1) var(--ease)}
button.flow-step:hover{background:var(--hover-1)}
.flow-step .k{font-size:12px;color:var(--ink-48);font-variant-numeric:tabular-nums}
.flow-step .t{font-size:var(--fs-ui);font-weight:600}
.flow-step .row{flex-wrap:wrap;gap:6px}
.flow-step.is-off{background:var(--pearl);border-style:dashed}

/* 포털 미리보기 — 휴대폰 틀 */
.phone{width:100%;max-width:390px;border-radius:36px;padding:12px;background:var(--tile);box-shadow:0 20px 50px #0000002e}
.phone-screen{background:var(--canvas);border-radius:26px;overflow:hidden;max-height:760px;overflow-y:auto}
.portal-hero{background:var(--parchment);padding:28px 22px 20px}
.portal-hero .brand{font-size:12px;letter-spacing:.12em;color:var(--ink-48);font-weight:600}
.portal-sec{padding:18px 22px;border-top:1px solid var(--divider-soft)}
.portal-sec h3{font-size:var(--fs-ui);margin-bottom:10px}
.portal-note{font-size:11.5px;color:var(--ink-48);line-height:1.5;background:var(--pearl);border-radius:var(--r-sm);padding:10px 12px}

/* 사진 · 측정 결과 자리 */
.slot-img{aspect-ratio:4/3;border:1px dashed var(--ink-24);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink-48);font-size:12px;background:var(--pearl);padding:8px}
.slot-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.slot-val{border:1px dashed var(--ink-24);border-radius:var(--r-sm);padding:10px 12px;font-size:12px;color:var(--ink-48);background:var(--pearl)}

/* 기타 */
.demo-flag{font-size:11px;color:var(--ink-48);line-height:1.45;padding:0 12px 10px}
.shell.is-admin .demo-flag{color:#ffffff80}
.note-q{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--bad);background:var(--bad-bg);border-radius:var(--r-pill);padding:1px 8px;white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:var(--fs-ui);padding:8px 0;border-bottom:1px solid var(--divider-soft)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--ink-48)}
.msg-bubble{background:var(--parchment);border-radius:14px 14px 14px 4px;padding:12px 14px;font-size:13.5px;line-height:1.55;white-space:pre-line}
.page-intro{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.page-intro p{color:var(--ink-48);font-size:var(--fs-ui)}
.gate{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
.gate .arr{color:var(--ink-24)}
.gate .on{font-weight:700;color:var(--ink)}
.gate .off{color:var(--ink-48)}
.mnav{display:none}
.is-meeting .no-meet{display:none!important}
.grid-3>.wide{grid-column:span 2}
.slot-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
.slot-pick .chip{justify-content:center;padding:0;font-variant-numeric:tabular-nums}
.slot-pick .chip:disabled{opacity:.3;cursor:not-allowed;text-decoration:line-through}
.check-row{display:flex;align-items:center;gap:8px;font-size:var(--fs-ui);padding:4px 0;cursor:pointer}
.check-row input{width:16px;height:16px;accent-color:var(--blue)}
.textarea{width:100%}
.deadline-over{color:var(--bad);font-weight:600}
.grid-2>*,.grid-3>*{min-width:0}

@media (max-width:1100px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .shell{flex-direction:column}
  .sidebar{display:none}
  .mnav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--hairline);background:var(--parchment);position:sticky;top:0;z-index:20}
  .mnav a{flex:none;font-size:13px;padding:6px 12px;border-radius:var(--r-pill);color:var(--ink);background:var(--canvas);box-shadow:inset 0 0 0 1px var(--hairline)}
  .mnav a.active{color:var(--blue);font-weight:600;box-shadow:inset 0 0 0 2px var(--blue-focus)}
  .shell-content{padding:16px 16px 48px}
  .flow{grid-template-columns:1fr}
  .cal-cell{min-height:64px;padding:4px}
  .cal-item{font-size:10px;padding:0 3px}
  .sched-row,.sched-head,.sched2{grid-template-columns:44px repeat(var(--lanes,2),minmax(0,1fr))}
  .topbar-search{display:none}
  .grid-3>.wide{grid-column:auto}
  .card-head{flex-wrap:wrap}
}

function monthCells(ym) {
  const first = toD(ym + '-01'), start = new Date(first);
  start.setDate(1 - first.getDay());
  const cells = [];
  for (let i = 0; i < 42; i++) { const d = new Date(start); d.setDate(start.getDate() + i); cells.push(iso(d)); }
  while (cells.length > 35 && cells.slice(-7).every(d => d.slice(0, 7) !== ym)) cells.splice(-7);
  return cells;
}

ACTIONS['portal-open'] = el => {
  const c = cust(el.dataset.id);
  openDrawer(`포털 링크 · ${esc(c.name)}`, `<div class="stack" id="pf">${fld('노션 고객 페이지 주소', `<input class="input" name="url" placeholder="https://….notion.site/…" value="${esc(c.portalUrl || '')}">`, '고객 1명당 노션 페이지 1개 — 지금 쓰시는 방식 그대로')}<div id="pf-err"></div></div>`,
    `<button class="btn btn-pearl" data-act="close">닫기</button><button class="btn btn-primary" data-act="portal-save" data-id="${c.id}">저장</button>`, 520);
};
ACTIONS['portal-save'] = el => {
  const c = cust(el.dataset.id), url = $('#pf [name=url]').value.trim();
  if (!/^https?:\/\/\S+\.\S+/.test(url)) { $('#pf-err').innerHTML = errBox('주소 형식을 확인하세요 (https://로 시작)'); return; }
  c.portal = true; c.portalUrl = url;
  const held = MSGLOG.findIndex(l => l.cid === c.id && l.key === 'T_POSTCARE_PORTAL_NEXT_DAY' && l.status === 'HELD');
  renderRoute();
  if (held < 0) return toast('포털 링크를 저장했습니다 (데모)');
  openDrawer('포털 링크를 저장했습니다', `<div class="banner"><span>보류된 <b>${tplName('T_POSTCARE_PORTAL_NEXT_DAY')}</b>가 있습니다 (${fmtAt(MSGLOG[held].at)}). 이제 링크를 넣어 보낼 수 있습니다.</span></div>`,
    `<button class="btn btn-pearl" data-act="close">나중에</button><button class="btn btn-primary" data-act="log-fix" data-i="${held}" data-do="send">지금 보내기</button>`, 480);
};

/* F8 안내 처리 — 보류 · 실패 · 직접 보내기. 모든 처리는 발송 기록에 남는다 */
const logFixBtns = l => {
  const b = (d, t) => `<button class="btn btn-sm btn-pearl" data-act="log-fix" data-i="${l.i}" data-do="${d}">${t}</button>`;
  if (l.status === 'HELD') return (l.via === '앱 채팅' ? b('app', '앱 채팅으로 보냄') : b('alt', '대체 문구로 보내기')) + ' ' + b('drop', '보내지 않기');
  if (l.status === 'FAILED') return b('retry', '다시 보내기') + ' ' + b('app', '앱 채팅으로 보냄');
  return '';
};
ACTIONS['log-fix'] = el => {
  const l = MSGLOG[Number(el.dataset.i)], d = el.dataset.do;
  const note = { send: '링크 넣어 보냄', alt: '대체 문구로 보냄', drop: '보내지 않기로 함', retry: '다시 보냄', app: '앱 채팅으로 보냄' }[d];
  l.status = d === 'drop' ? 'SKIPPED' : 'SENT';
  if (d === 'app') l.via = '앱 채팅';
  l.note = (l.note ? l.note + ' → ' : '') + `${note} (${fmtAt(NOW)})`;
  renderRoute(); toast(`${note} — 발송 기록에 남았습니다 (데모)`);
};
let MS = null;
function drawMsg() {
  const c = cust(MS.cid), t = TEMPLATES.find(x => x.key === MS.key), n = nextResv(c.id);
  const block = !c.phone ? '연락처가 없습니다 — 앱 채팅으로 직접 보내세요' : t.kind === '광고성' && !c.consent ? '광고 수신 동의가 없어 이 문구는 보낼 수 없습니다' : !t.text ? '문구가 비어 있습니다' : '';
  const preview = (t.text || '').replace(/#\{고객명\}/g, c.name).replace(/#\{일시\}/g, n ? `${fmtD(n.date)} ${n.time}` : '(예약 없음)')
    .replace(/#\{프로그램\}/g, n ? prog(n.pid).name : '').replace(/#\{포털링크\}/g, c.portal ? (c.portalUrl || 'notion.site/…') : '(포털 링크 없음)');
  paintDrawer('ms', `안내 보내기 · ${esc(c.name)}`, `<div class="stack">
    ${fld('문구', `<select class="input select" data-change="ms-key">${TEMPLATES.filter(x => !(MEETING && x.stage === '예약')).map(x => `<option value="${x.key}"${x.key === MS.key ? ' selected' : ''}>${x.code} · ${x.name} (${x.via})</option>`).join('')}</select>`)}
    <section><h3 class="mb-3">미리보기 <span class="caption muted">예시 문구</span></h3>${t.text ? `<div class="msg-bubble">${esc(preview)}</div>` : '<div class="banner">문구가 비어 있습니다</div>'}</section>
    ${block ? errBox(block) : `<p class="caption muted">${t.via}로 보냅니다 · 발송 기록에 남습니다</p>`}</div>`,
    `<button class="btn btn-pearl" data-act="close">닫기</button><button class="btn btn-primary" data-act="msg-send"${block ? ' disabled' : ''}>보내기</button>`, 560);
}
ACTIONS['msg-open'] = el => { MS = { cid: el.dataset.id, key: MEETING ? 'T_POSTCARE_PORTAL_NEXT_DAY' : 'T_D_MINUS_1' }; drawMsg(); };
CHANGES['ms-key'] = el => { MS.key = el.value; drawMsg(); };
ACTIONS['msg-send'] = () => { const id = MS.cid; logMsg(id, MS.key, '직접 보냄'); renderRoute(); toast('보냈습니다 — 발송 기록에 남았습니다 (데모)'); ACTIONS.cust({ dataset: { id } }); };

/* F2 수락 전 확인 — 다른 시간 제안 · 거절 */
ACTIONS['req-propose'] = el => {
  const r = RESV.find(x => x.id === el.dataset.id);
  r.note = `${el.dataset.t} 제안함 · ${fmtAt(NOW)}`;
  renderRoute(); toast(`${CHANNELS[r.ch].short} 채팅으로 보낸 ${el.dataset.t} 제안을 기록했습니다 (데모)`);
};
ACTIONS['req-reject'] = el => {
  const r = RESV.find(x => x.id === el.dataset.id);
  r.status = 'CANCELED'; r.reason = '거절';
  renderRoute(); toast(`거절했습니다 — ${CHANNELS[r.ch].short} 앱에서도 거절 처리하세요 (데모)`);
};

;
/* ── 시작: 클릭 · 입력 · 변경 위임 · 화면 전환 ── */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A') ev.preventDefault();
  fn(el, ev);
});
document.addEventListener('input', ev => {
  const el = ev.target.closest('[data-input]');
  if (el && INPUTS[el.dataset.input]) INPUTS[el.dataset.input](el, ev);
});
document.addEventListener('change', ev => {
  const el = ev.target.closest('[data-change]');
  if (el && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el, ev);
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeDrawer(); });
window.addEventListener('hashchange', renderRoute);
renderRoute();
</script>
</body>
</html>
